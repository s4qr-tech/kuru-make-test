<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HISTORY｜kuru.make</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="about.css?v=38">
</head>
<body data-page="history">

<section class="page-head"><h1>HISTORY</h1><p>活動のあゆみ（沿革）。<br>年度のボタンを押すと、その年度の歩みが見られます。</p></section>

<section class="wrap hist">
  <div class="ybtns" id="ybtns" role="tablist" aria-label="年度"></div>
  <p class="ysum" id="ysum"></p>
  <ul class="legend" aria-label="季節の色">
    <li data-s="spring">春 4〜6月</li><li data-s="summer">夏休み 7〜9月</li><li data-s="autumn">秋 10〜11月</li><li data-s="winter">冬 12〜1月</li><li data-s="plum">春休み 2〜3月</li>
  </ul>
  <ol class="ytl" id="ytl" aria-live="polite"></ol>
  <p class="lead" style="margin-top:70px;font-size:12px;color:var(--mute)">※ 内容・日付・施設名は仮置きです。年度が進むたびに、下の HISTORY データへ1年度ぶんを足すと、ボタンが増えます。</p>
</section>

<script src="site.js?v=10"></script>
<script>
// ▼ 沿革データ：年度ごとに、新しい出来事を上に足していく。年度が増えるとボタンも自動で増えます。
//   ym: 年月 ／ tag: 区分 ／ t: タイトル ／ x: 説明（年度は4月はじまり）
var HISTORY = {
  2025: {
    sum: '活動のはじまり。協力施設での試行を重ね、研究のかたちを探った年度。【仮】',
    items: [
      {ym:'2026.03', tag:'研究', t:'和アートセラピーの研究が論文に掲載', x:'『順天堂グローバル教養論集』第十一巻に、「和アートセラピーの気分変容効果に関する研究」が掲載されました。'},
      {ym:'2025.10', tag:'訪問', t:'協力施設での試行【仮】', x:'協力施設で、和紙のちぎり絵を試行的に実施。参加者の反応を記録しました。'},
      {ym:'2025.04', tag:'発足', t:'活動開始【仮】', x:'和アートセラピーの活動をスタート。学生メンバーで、題材と進め方を相談しました。'}
    ]
  },
  2026: {
    sum: 'NPO法人化に向けて、活動と研究を広げる年度。【仮】',
    items: [
      {ym:'2026.11', tag:'NPO', t:'NPO法人設立の準備を開始', x:'法人化に向けて、サイトと体制づくりの準備をはじめました。'},
      {ym:'2026.10', tag:'展示', t:'学園祭展示・ハロウィンイベント【仮】', x:'活動紹介パネルと来場者向けのちぎり絵体験。大阪のデイサービス施設では、ハロウィンのコラージュを一緒につくりました。'},
      {ym:'2026.09', tag:'展示', t:'敬老の日 作品展【仮】', x:'施設のみなさんの作品を、A施設のロビーで展示しました。'},
      {ym:'2026.08', tag:'研究', t:'夏合宿【仮】', x:'研究計画の見直しと、秋の題材の試作。'},
      {ym:'2026.07', tag:'訪問', t:'七夕飾りづくり【仮】', x:'B施設で、ちぎった和紙の短冊と天の川をみんなで制作。'},
      {ym:'2026.06', tag:'交流', t:'ロールプレイ・振り返り会【仮】', x:'声かけのロールプレイと振り返り会。メンバー交流会もあわせて実施。'},
      {ym:'2026.05', tag:'訪問', t:'今年度はじめての訪問（こいのぼりの貼り絵）【仮】', x:'A施設で、和紙を貼りあわせて「こいのぼり」を制作。'},
      {ym:'2026.04', tag:'新歓', t:'説明会【仮】', x:'新しい仲間向けの説明会。和紙ちぎりの体験コーナーも。'}
    ]
  },
  2027: {
    sum: 'これからの年度。実際の予定・実績が決まったら、ここに足していきます。【仮】',
    items: [
      {ym:'2027.04', tag:'予定', t:'【仮】NPO法人としての活動開始', x:'法人設立後の最初の年度。施設・学生・研究をつなぐ活動を、地域へ広げていく計画です。'}
    ]
  }
};

function period(m){ return m>=4&&m<=6?'spring':m>=7&&m<=9?'summer':m>=10&&m<=11?'autumn':(m===12||m===1)?'winter':'plum'; }
var years=Object.keys(HISTORY).sort(), btns=document.getElementById('ybtns'), tl=document.getElementById('ytl'), sum=document.getElementById('ysum');
btns.innerHTML=years.map(function(y){return '<button role="tab" data-y="'+y+'"><b>'+y+'</b><small>年度</small></button>'}).join('');
function show(y){
  [].forEach.call(btns.children,function(b){var on=b.getAttribute('data-y')===String(y);b.classList.toggle('is-on',on);b.setAttribute('aria-selected',on)});
  var d=HISTORY[y];sum.textContent=y+'年度｜'+d.sum;
  tl.innerHTML=d.items.map(function(it){
    var m=+it.ym.split('.')[1],s=period(m);
    return '<li data-s="'+s+'"><span class="ytl-d">'+it.ym+'</span><div><span class="ytl-t">'+it.tag+'</span><strong>'+it.t+'</strong><p>'+it.x+'</p></div></li>';
  }).join('');
}
btns.addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.getAttribute('data-y'))});
var now=new Date(),fy=now.getMonth()+1>=4?now.getFullYear():now.getFullYear()-1;
show(HISTORY[fy]?fy:years[years.length-1]);
</script>
</body>
</html>
