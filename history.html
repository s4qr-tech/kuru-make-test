<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HISTORY｜kuru.make</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="about.css?v=14">
</head>
<body data-page="history">

<section class="page-head"><h1>HISTORY</h1><p>活動のあゆみ。<br>1年を、季節と長期休みの5つに分けて。</p></section>
<section class="wrap">
  <div class="ptabs" id="ptabs" role="tablist"></div>
  <ul class="pmonths" id="pmonths" aria-live="polite"></ul>
  <p class="lead" style="margin-top:70px;font-size:12px;color:var(--mute)">※ 活動内容・施設名はすべて仮置きです。実際の予定・実績に差し替えます（このページの MONTHS を書き換えます）。</p>
</section>

<script src="site.js?v=4"></script>
<script>
// 月ごとの活動。ここを書き換えると、各時期の中身が更新されます
var MONTHS=[
  {m:4,t:'説明会',tag:'新歓',x:'新しい仲間向けの説明会。和紙ちぎりの体験コーナーも。'},
  {m:5,t:'A施設訪問',tag:'訪問',x:'今年度はじめての訪問。和紙で「こいのぼり」を貼りあわせました。'},
  {m:6,t:'ロールプレイ・振り返り会',tag:'交流',x:'声かけのロールプレイと振り返り会。メンバー交流会もあわせて実施。'},
  {m:7,t:'七夕飾りづくり',tag:'訪問',x:'B施設で、ちぎった和紙の短冊と天の川をみんなで制作。'},
  {m:8,t:'夏合宿',tag:'研究',x:'研究計画の見直しと、秋の題材の試作。'},
  {m:9,t:'敬老の日 作品展',tag:'展示',x:'施設のみなさんの作品を、施設のロビーで展示しました。'},
  {m:10,t:'学園祭展示・ハロウィン',tag:'展示',x:'活動紹介パネルと、来場者向けのちぎり絵体験。大阪のデイサービス施設ではハロウィンイベントを開催。'},
  {m:11,t:'紅葉のちぎり絵',tag:'訪問',x:'C施設訪問。赤や黄の和紙を破いて、紅葉の山をつくりました。'},
  {m:12,t:'年末振り返り会',tag:'交流',x:'1年の記録を見返し、みんなで次の年の目標を話し合いました。'},
  {m:1,t:'お正月飾り',tag:'訪問',x:'和紙を切り貼りして、干支と鏡もちの飾りを制作。'},
  {m:2,t:'研究まとめ',tag:'研究',x:'活動記録とアンケートを分析し、報告書にまとめます。'},
  {m:3,t:'成果発表',tag:'発表',x:'成果を発表し、1年の活動をふり返ります。'}
];
var PERIODS=[
  {key:'spring',ja:'春',en:'SPRING',r:'4〜6月',ms:[4,5,6]},
  {key:'summer',ja:'夏休み',en:'SUMMER BREAK',r:'7〜9月',ms:[7,8,9]},
  {key:'autumn',ja:'秋',en:'AUTUMN',r:'10〜11月',ms:[10,11]},
  {key:'winter',ja:'冬',en:'WINTER',r:'12〜1月',ms:[12,1]},
  {key:'plum',ja:'春休み',en:'SPRING BREAK',r:'2〜3月',ms:[2,3]}
];
var tabs=document.getElementById('ptabs'),list=document.getElementById('pmonths');
tabs.innerHTML=PERIODS.map(function(p,i){return '<button role="tab" data-i="'+i+'" data-s="'+p.key+'">'+p.ja+'<small>'+p.en+'　'+p.r+'</small></button>'}).join('');
function show(i){
  [].forEach.call(tabs.children,function(b,j){b.classList.toggle('is-on',i===j);b.setAttribute('aria-selected',i===j)});
  list.setAttribute('data-s',PERIODS[i].key);
  list.innerHTML=PERIODS[i].ms.slice().reverse().map(function(m){return MONTHS.filter(function(d){return d.m===m})}).reduce(function(a,b){return a.concat(b)},[]).map(function(d){
    return '<li><span class="pm">'+d.m+'月</span><span class="pt">'+d.tag+'</span><div><strong>'+d.t+'</strong><p>'+d.x+'</p></div></li>';
  }).join('');
}
tabs.addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(+b.getAttribute('data-i'))});
var mo=new Date().getMonth()+1,cur=PERIODS.findIndex(function(p){return p.ms.indexOf(mo)>-1});
show(cur<0?0:cur);
</script>
</body>
</html>
